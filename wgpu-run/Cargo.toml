[package]
name = "demosaic-run"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
# for the demosaic-run test tool only (raw decoding, PNG output); the library uses neither
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
