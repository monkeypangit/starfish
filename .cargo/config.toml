# Link the C runtime statically on Windows, so starfish.exe runs without the
# Visual C++ Redistributable (VCRUNTIME140.dll), which clean machines lack.
# CI checks the .exe's imports for it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The web viewer (web/): rawler's uuid needs getrandom's browser backend,
# which is picked by this cfg as well as the crate feature.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
