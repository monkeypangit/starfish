# Link the C runtime statically on Windows, so starfish.exe runs without the
# Visual C++ Redistributable (VCRUNTIME140.dll), which clean machines lack.
# CI checks the .exe's imports for it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
