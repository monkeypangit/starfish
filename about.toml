# `cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html`: the licence
# texts of every dependency, shipped with each package (CI does this). Keep in
# step with deny.toml; rawler's LGPL-2.1 text is what the binaries must carry.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "NCSA",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "LGPL-2.1",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
