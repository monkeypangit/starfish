[package]
name = "starfish-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Starfish's neural demosaic in the browser: one raw file, WebGPU"
publish = false

# Built for wasm32 only (web/build.sh); on any other target the crate is empty,
# so `cargo test --workspace` passes over it.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
demosaic-run = { path = "../wgpu-run" }
js-sys = "0.3"
rawler = "0.8"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Performance", "Window", "console"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "webgpu"] }
# rawler uses uuid, which needs to be told where wasm gets its randomness
# (plus `--cfg getrandom_backend="wasm_js"`, in .cargo/config.toml)
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
